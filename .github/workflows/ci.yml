name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, format, typecheck, test, build, audit
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # pnpm version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each check below runs even if an earlier one failed (if: !cancelled()),
      # so a single run reports every problem. Any failed step fails the job,
      # which fails the PR check.
      - name: Lint
        run: pnpm run lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm run build

      # Dependency vulnerability gate (issue #20): fails CI on any high/critical
      # advisory in the dependency tree. Blocking — the flip from advisory-only
      # was a deliberate manual edit, not date-based (rationale in
      # docs/tooling.md). Moderate/low advisories stay below --audit-level=high
      # and don't fail here.
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=high

  # Boots the app and runs the Playwright smoke test — proves it *runs*, not
  # just that it compiles. Parallel to `verify`; same triggers. Only the
  # existing smoke spec runs here; real flows arrive with the Phase 3 slice.
  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The proxy (src/proxy.ts) refreshes the Supabase session on every
      # request and fails loudly when its config is missing, so the app will
      # not serve a single page without these. This job runs no Supabase
      # stack; placeholders are enough because with no session cookie the
      # refresh short-circuits before making a network call. Not secrets —
      # both are NEXT_PUBLIC_ by design (see .env.example).
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # pnpm version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the Chromium binary (~/.cache/ms-playwright), keyed on the
      # lockfile — which pins the exact @playwright/test version, so a bump
      # busts the cache and re-downloads.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Idempotent: on a cache hit the binary is present and only the OS libs
      # (apt, a few seconds) are (re)installed; on a miss it also downloads.
      - name: Install Playwright browser (Chromium + OS deps)
        run: pnpm exec playwright install --with-deps chromium

      # CI is set by GitHub Actions, so playwright.config.ts keys off it
      # (forbidOnly, retries: 2, reuseExistingServer: false) with no extra flags.
      - name: Run E2E smoke test
        run: pnpm run test:e2e

      # Upload the HTML report on failure (and on retried-pass, capturing the
      # trace that retries: 2 would otherwise hide).
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Boots the local Supabase stack and runs the pgTAP suite — the RLS policies
  # and write guards in supabase/tests/ are the database authorization boundary,
  # and until this job existed they ran only when someone remembered to invoke
  # them locally (issue #72). Parallel to `verify`; same triggers, no path
  # filtering: a policy regression can be introduced by a migration, a config
  # change, or a CLI bump, so gating on changed paths would miss cases.
  db:
    name: Database (pgTAP RLS + write guards)
    runs-on: ubuntu-latest
    # The stack is ~8 containers pulled cold on every run; this is the slowest
    # job in the matrix. The cap is a backstop against a container that never
    # reaches healthy — without it a hung boot burns the default 6h.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # pnpm version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Installs the pinned `supabase` CLI devDependency (its postinstall fetches
      # the platform binary — allow-listed in pnpm-workspace.yaml), so CI runs the
      # same CLI version as local, not a floating action-installed one.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -x skips containers the SQL suite never touches, trading image pulls for
      # wall-clock. Do NOT add `db` (Postgres itself) or `storage` — the storage
      # service creates the `storage` schema that
      # 20260717120800_create_storage_bucket.sql writes its bucket and object
      # policies into, so excluding it fails the migration outright. `kong`,
      # `rest`, `realtime`, and `meta` are kept deliberately: cheap, and they keep
      # this boot shaped like a real one. If this step ever misbehaves, dropping
      # -x entirely is the first thing to try.
      - name: Start Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,functions,analytics,vector,inbucket

      # Redundant with `start` (which already applies migrations + seed) but kept
      # on purpose: it asserts that the documented one-command known-good state
      # actually works, and costs seconds now that the containers are up.
      - name: Reset to migrations + seed
        run: pnpm exec supabase db reset

      - name: Run pgTAP suite
        run: pnpm exec supabase test db

      # First-failure triage: which containers exist, and did any exit early.
      - name: Dump container state on failure
        if: ${{ failure() }}
        run: |
          docker ps -a
          pnpm exec supabase status || true
