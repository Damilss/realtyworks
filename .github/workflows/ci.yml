name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, format, typecheck, test, build, audit
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # pnpm version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each check below runs even if an earlier one failed (if: !cancelled()),
      # so a single run reports every problem. Any failed step fails the job,
      # which fails the PR check.
      - name: Lint
        run: pnpm run lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm run build

      # Dependency vulnerability gate (issue #20). Non-blocking until 2026-07-08
      # (one week after the issue opened) to allow triage of existing advisories;
      # on/after that date, delete the continue-on-error line to make it blocking.
      # Known finding today: vite@8.0.13 (dev-only, transitive via vitest) —
      # GHSA-fx2h-pf6j-xcff, patched in vite >=8.0.16.
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm audit --audit-level=high
