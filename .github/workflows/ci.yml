name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, format, typecheck, test, build, audit
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # pnpm version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each check below runs even if an earlier one failed (if: !cancelled()),
      # so a single run reports every problem. Any failed step fails the job,
      # which fails the PR check.
      - name: Lint
        run: pnpm run lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm run build

      # Dependency vulnerability gate (issue #20): fails CI on any high/critical
      # advisory in the dependency tree. Blocking — the flip from advisory-only
      # was a deliberate manual edit, not date-based (rationale in
      # docs/tooling.md). Moderate/low advisories stay below --audit-level=high
      # and don't fail here.
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=high

  # Boots the app and runs the Playwright smoke test — proves it *runs*, not
  # just that it compiles. Parallel to `verify`; same triggers. Only the
  # existing smoke spec runs here; real flows arrive with the Phase 3 slice.
  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # pnpm version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the Chromium binary (~/.cache/ms-playwright), keyed on the
      # lockfile — which pins the exact @playwright/test version, so a bump
      # busts the cache and re-downloads.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Idempotent: on a cache hit the binary is present and only the OS libs
      # (apt, a few seconds) are (re)installed; on a miss it also downloads.
      - name: Install Playwright browser (Chromium + OS deps)
        run: pnpm exec playwright install --with-deps chromium

      # CI is set by GitHub Actions, so playwright.config.ts keys off it
      # (forbidOnly, retries: 2, reuseExistingServer: false) with no extra flags.
      - name: Run E2E smoke test
        run: pnpm run test:e2e

      # Upload the HTML report on failure (and on retried-pass, capturing the
      # trace that retries: 2 would otherwise hide).
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
